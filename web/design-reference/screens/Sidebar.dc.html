<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CredLens · Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="CredLens" style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #E7ECE8; background: #0F1D19; box-sizing: border-box; width: 100%; min-height: 900px; padding: 24px 16px; display: flex; flex-direction: column; gap: 28px">
  <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #FFFFFF; padding: 0 8px">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true">
      <circle cx="15" cy="15" r="13" stroke="#7FB8A6" stroke-width="2" stroke-dasharray="3 3"></circle>
      <circle cx="15" cy="15" r="8.5" stroke="#FFFFFF" stroke-width="3"></circle>
      <circle cx="15" cy="15" r="2.5" fill="#E0A44A"></circle>
    </svg>
    <span style="display: flex; flex-direction: column; line-height: 1.1">
      <span style="font-size: 19px; font-weight: 700; letter-spacing: -0.01em">CredLens</span>
      <span style="font-size: 11px; color: #9DB2AA; letter-spacing: .06em; text-transform: uppercase">Merchant readiness</span>
    </span>
  </a>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #8FA59C; padding: 0 10px 6px">Work</span>
    <sc-for list="{{work}}" as="it" hint-placeholder-count="3">
      <a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.style}}">
        <span>{{it.label}}</span>
        <sc-if value="{{it.hasBadge}}" hint-placeholder-val="{{ false }}"><span class="mono" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #C9D6D0">{{it.badge}}</span></sc-if>
      </a>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #8FA59C; padding: 0 10px 6px">Trust</span>
    <sc-for list="{{trust}}" as="it" hint-placeholder-count="4">
      <a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.style}}">
        <span>{{it.label}}</span>
        <sc-if value="{{it.admin}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; color: #9DB2AA; border: 1px solid #3A4E47; border-radius: 6px; padding: 1px 6px">admin</span></sc-if>
      </a>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 10px">
    <label for="mode" style="font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #8FA59C">Data source</label>
    <select id="mode" style="font: inherit; font-size: 13px; color: #FFFFFF; background: #182B25; border: 1px solid #2F453E; border-radius: 8px; padding: 10px; min-height: 44px">
      <option>synthetic_bd · Synthetic</option>
      <option>taiwan_cc · Taiwan cards</option>
      <option>india_ltfs · India vehicle loans</option>
      <option>kiva_asia · Kiva Asia</option>
      <option>homecredit · country not stated</option>
    </select>
    <span style="font-size: 12px; line-height: 17px; color: #9DB2AA">Public modes show only what their data supports.</span>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 10px">
    <span style="font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #8FA59C">Demo role</span>
    <div role="group" aria-label="Demo role" style="display: flex; background: #182B25; border-radius: 10px; padding: 3px; gap: 2px">
      <sc-for list="{{roles}}" as="r" hint-placeholder-count="3">
        <button type="button" aria-pressed="{{r.on}}" onClick="{{r.pick}}" style="{{r.style}}">{{r.label}}</button>
      </sc-for>
    </div>
    <span style="font-size: 12px; line-height: 17px; color: #9DB2AA">Signed in as <span style="font-family: 'IBM Plex Mono', monospace; color: #E7ECE8">{{who}}</span>. A demo role switch, not a login.</span>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["queue","merchant","decisions","portfolio","model","consent","audit","import"],"default":"queue"},"$preview":{"width":248,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { role: 'officer' };
  }
  renderVals() {
    var active = this.props.active ?? 'queue';
    if (active === 'merchant') active = 'queue';
    var base = 'display: flex; align-items: center; justify-content: space-between; gap: 8px; text-decoration: none; font-size: 14px; padding: 10px; border-radius: 9px; min-height: 24px; ';
    var item = function (key, label, href, extra) {
      var on = key === active;
      return Object.assign({ key: key, label: label, href: href, current: on ? 'page' : 'false', style: base + (on ? 'background: #1F3B33; color: #FFFFFF; font-weight: 600; box-shadow: inset 3px 0 0 #E0A44A' : 'color: #C9D6D0; font-weight: 500') }, extra || {});
    };
    var self = this;
    var roles = [['officer', 'Officer', 'officer-1'], ['admin', 'Admin', 'admin-1'], ['viewer', 'Viewer', 'viewer-1']].map(function (r) {
      var on = self.state.role === r[0];
      return { label: r[1], on: on, pick: function () { self.setState({ role: r[0] }); }, style: 'flex: 1; border: 0; font: inherit; font-size: 12px; font-weight: 600; padding: 9px 4px; border-radius: 8px; cursor: pointer; min-height: 36px; ' + (on ? 'background: #E7ECE8; color: #0F1D19' : 'background: transparent; color: #C9D6D0') };
    });
    var who = { officer: 'officer-1', admin: 'admin-1', viewer: 'viewer-1' }[this.state.role];
    return {
      work: [
        item('queue', 'Review queue', 'Main.dc.html', { hasBadge: true, badge: '3' }),
        item('decisions', 'Decision log', 'Decisions.dc.html', { hasBadge: false }),
        item('portfolio', 'Portfolio', 'Portfolio.dc.html', { hasBadge: false })
      ],
      trust: [
        item('model', 'Model card', 'ModelCard.dc.html', { admin: false }),
        item('consent', 'Consent', 'Consent.dc.html', { admin: false }),
        item('audit', 'Audit log', 'Audit.dc.html', { admin: true }),
        item('import', 'Data import', 'Import.dc.html', { admin: true })
      ],
      roles: roles,
      who: who
    };
  }
}
</script>
</body>
</html>
