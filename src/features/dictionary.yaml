# Feature dictionary: every feature, its meaning and its reason sentences.
# Source of truth for the wording: docs/FEATURE_DICTIONARY.md. Keep the two in step.
# Owner role: B (data engineer) for features, A (lead) for wording.
#
# Rules (docs/FEATURE_DICTIONARY.md):
# - Sentences are observations, never accusations or causes.
# - Officers see the sentence, never the feature name.
# - Questionnaire sentences must carry "directional" / "ইঙ্গিতমাত্র" and appear only in the
#   questionnaire panel; group D is not part of the headline model.
# - If a feature is missing for a merchant, no reason is generated for it.
# - The Bangla text must be reviewed by a native speaker before the demo.
# - Public-data modes (kiva_asia, taiwan_cc) add their own entries in Phase 7.
# - `shown_when` says when a plain sentence is true for a merchant (above / below /
#   at_least / at_most a value). When it is not true, the comparing sentence under
#   `otherwise` is shown instead ("... than at similar shops"), which is true whenever the
#   input moved the score that way. `detail` says how the number beside a reason is written.
# - Every model input says which way it points: `higher_is: better` or `higher_is: worse`.
#   Training removes an input whose learned weight points the other way, so a reason
#   sentence can never contradict the facts.
# - `delivered_rate` is context only: it falls when a rider or an address fails, which is
#   not the merchant's doing, and it repeats what the return and failure rates say.
# - Entries marked `model_input: false` describe how MUCH data a merchant has (number of
#   purchases, total value, number of parcels). They are shown to the officer and feed
#   coverage, but the model never sees them, so a thin file cannot lower the score.

groups:
  A: purchases
  B: payments
  C: deliveries
  D: questionnaire

features:
  purchases_90d:
    group: A
    model_input: false           # context only: shown on the profile, never given to the model
    definition: Mokam purchase orders placed by the merchant in the 90 days before cutoff
    higher_means: active restocking
    positive:
      en: "The shop restocks regularly, with many recent purchases."
      bn: "দোকানটি নিয়মিত মাল কেনে, সাম্প্রতিক কেনাকাটা অনেক।"
    negative:
      en: "Recent restocking activity is low."
      bn: "সাম্প্রতিক মাল কেনা কম।"

  purchase_value_90d:
    group: A
    model_input: false           # context only: shown on the profile, never given to the model
    definition: Total purchase value, 90 days
    higher_means: larger business
    positive:
      en: "Recent stock purchases are healthy in size."
      bn: "সাম্প্রতিক মাল কেনার পরিমাণ ভালো।"
    negative:
      en: "Recent stock purchases are small."
      bn: "সাম্প্রতিক মাল কেনার পরিমাণ কম।"

  basket_growth:
    group: A
    higher_is: better
    shown_when:                  # the sentence must be true, not just "better than average"
      positive: {above: 0}
      negative: {below: 0}
    otherwise:                   # used when the plain sentence is not true for the merchant
      positive:
        en: "Stock purchases are growing faster than at similar shops."
        bn: "সমান ধরনের দোকানের তুলনায় মাল কেনা দ্রুত বাড়ছে।"
      negative:
        en: "Stock purchases are growing more slowly than at similar shops."
        bn: "সমান ধরনের দোকানের তুলনায় মাল কেনা ধীরে বাড়ছে।"
    detail: {label: "Purchase growth", format: percent_change}
    definition: Purchase value last 90 days vs the 90 before, %
    higher_means: growth
    positive:
      en: "Stock purchases are growing compared with the previous three months."
      bn: "আগের তিন মাসের তুলনায় মাল কেনা বাড়ছে।"
    negative:
      en: "Stock purchases are falling compared with the previous three months."
      bn: "আগের তিন মাসের তুলনায় মাল কেনা কমছে।"

  purchase_volatility:
    group: A
    model_input: false           # context only: shown on the profile, never given to the model
    definition: Std. dev. of weekly purchase value / mean
    higher_means: unstable
    positive:
      en: "Weekly restocking is steady."
      bn: "সাপ্তাহিক মাল কেনা স্থিতিশীল।"
    negative:
      en: "Weekly restocking swings a lot."
      bn: "সাপ্তাহিক মাল কেনায় ওঠানামা বেশি।"

  purchase_regularity:
    group: A
    model_input: false           # context only: shown on the profile, never given to the model
    definition: Share of weeks with at least one purchase
    higher_means: consistent
    positive:
      en: "The shop restocks in most weeks."
      bn: "দোকান বেশিরভাগ সপ্তাহে মাল কেনে।"
    negative:
      en: "The shop restocks in few weeks."
      bn: "দোকান কম সপ্তাহে মাল কেনে।"

  category_diversity:
    group: A
    model_input: false           # context only: shown on the profile, never given to the model
    definition: Number of product categories purchased
    higher_means: diversified
    positive:
      en: "Purchases cover several product categories."
      bn: "কেনাকাটা একাধিক ক্যাটাগরিতে ছড়ানো।"
    negative:
      en: "Purchases depend on very few categories."
      bn: "কেনাকাটা অল্প কয়েকটি ক্যাটাগরির ওপর নির্ভর করে।"

  supplier_repeat_share:
    group: A
    higher_is: better
    detail: {label: "Repeat-supplier share", format: share}
    definition: >-
      Chance that two of the merchant's purchases in the last 90 days came from the same
      supplier (counted over all pairs of purchases, so it does not depend on how many
      purchases there were)
    higher_means: stable sourcing
    positive:
      en: "The shop buys steadily from familiar suppliers."
      bn: "দোকান পরিচিত সরবরাহকারীর কাছ থেকে নিয়মিত কেনে।"
    negative:
      en: "Sourcing changes often between suppliers."
      bn: "সরবরাহকারী প্রায়ই বদলায়।"

  parcel_volume_90d:
    group: C
    model_input: false           # context only: shown on the profile, never given to the model
    sales_proxy: true
    definition: Outgoing REDX parcels, 90 days (only for merchants who sell online)
    higher_means: more sales
    positive:
      en: "The shop sends many parcels to its customers."
      bn: "দোকান তার ক্রেতাদের কাছে অনেক পার্সেল পাঠায়।"
    negative:
      en: "Few parcels sent to customers recently."
      bn: "সাম্প্রতিক সময়ে ক্রেতাদের কাছে পার্সেল কম গেছে।"

  avg_pay_delay_days:
    group: B
    higher_is: worse
    shown_when:
      positive: {at_most: 3}     # "close to the due date" = within the on-time window
    otherwise:
      positive:
        en: "Past payments were late by fewer days than at similar shops."
        bn: "সমান ধরনের দোকানের তুলনায় আগের পেমেন্টে কম দিন দেরি হয়েছে।"
    detail: {label: "Average payment delay", format: days}
    definition: Mean days late over past payments
    higher_means: worse
    positive:
      en: "Past payments were made close to the due date."
      bn: "আগের পেমেন্ট প্রায় নির্ধারিত সময়ে হয়েছে।"
    negative:
      en: "Past payments were often late."
      bn: "আগের পেমেন্ট প্রায়ই দেরিতে হয়েছে।"

  late_pay_count_90d:
    group: B
    higher_is: worse
    shown_when:
      positive: {at_most: 0}     # "No recent late payments" needs exactly none
      negative: {at_least: 1}
    otherwise:
      positive:
        en: "Fewer recent late payments than at similar shops."
        bn: "সমান ধরনের দোকানের তুলনায় সাম্প্রতিক দেরির পেমেন্ট কম।"
      negative:
        en: "More recent late payments than at similar shops."
        bn: "সমান ধরনের দোকানের তুলনায় সাম্প্রতিক দেরির পেমেন্ট বেশি।"
    detail: {label: "Late payments in 90 days", format: count}
    definition: Payments over 7 days late, 90 days
    higher_means: worse
    positive:
      en: "No recent late payments."
      bn: "সাম্প্রতিক কোনো দেরির পেমেন্ট নেই।"
    negative:
      en: "There were late payments recently."
      bn: "সাম্প্রতিক সময়ে পেমেন্টে দেরি হয়েছে।"

  ontime_payment_rate:
    group: B
    higher_is: better
    shown_when:
      positive: {above: 0.5}     # "Most payments" = more than half
      negative: {below: 0.5}
    otherwise:
      positive:
        en: "More payments arrive on time than at similar shops."
        bn: "সমান ধরনের দোকানের তুলনায় বেশি পেমেন্ট সময়মতো আসে।"
      negative:
        en: "Fewer payments arrive on time than at similar shops."
        bn: "সমান ধরনের দোকানের তুলনায় কম পেমেন্ট সময়মতো আসে।"
    detail: {label: "Payments on time", format: share}
    definition: Share of payments within 3 days of due
    higher_means: reliable
    positive:
      en: "Most payments arrive on time."
      bn: "বেশিরভাগ পেমেন্ট সময়মতো আসে।"
    negative:
      en: "Few payments arrive on time."
      bn: "কম পেমেন্ট সময়মতো আসে।"

  credit_utilisation:
    group: B
    higher_is: worse
    shown_when:
      negative: {above: 0.8}     # "close to the limit"
    otherwise:
      negative:
        en: "Credit use is higher than at similar shops."
        bn: "সমান ধরনের দোকানের তুলনায় ঋণের ব্যবহার বেশি।"
    detail: {label: "Credit limit in use", format: share}
    definition: Used limit / limit
    higher_means: stretched
    positive:
      en: "Credit use is moderate."
      bn: "ঋণের ব্যবহার মাঝারি।"
    negative:
      en: "Credit use is close to the limit."
      bn: "ঋণের ব্যবহার সীমার কাছাকাছি।"

  delivered_rate:
    group: C
    model_input: false           # context only: shown on the profile, never given to the model
    definition: Delivered parcels / dispatched, 90 days
    higher_means: reliable fulfilment
    positive:
      en: "Most parcels are delivered successfully."
      bn: "বেশিরভাগ পার্সেল সফলভাবে পৌঁছায়।"
    negative:
      en: "Many parcels are not delivered."
      bn: "অনেক পার্সেল পৌঁছায় না।"

  return_rate_90d:
    group: C
    higher_is: worse
    detail: {label: "Returns", format: share}
    definition: >-
      Merchant-attributable returns (refused, wrong item) / total, 90 days;
      address/rider returns excluded when return_reason is known
    higher_means: worse
    positive:
      en: "Delivery returns are lower than similar shops."
      bn: "সমান ধরনের দোকানের তুলনায় ডেলিভারি ফেরত কম।"
    negative:
      en: "Returns are higher than similar shops; this may reflect delivery conditions."
      bn: "সমান ধরনের দোকানের তুলনায় ফেরত বেশি; এটা ডেলিভারির পরিস্থিতির কারণেও হতে পারে।"

  failed_rate_90d:
    group: C
    higher_is: worse
    detail: {label: "Failed deliveries", format: share}
    definition: >-
      Failed parcels not tagged as an address or rider problem / total, 90 days
    higher_means: worse
    positive:
      en: "Few delivery failures."
      bn: "ডেলিভারি ব্যর্থতা কম।"
    negative:
      en: "Delivery failures are higher than usual; this may reflect address or rider issues."
      bn: "ডেলিভারি ব্যর্থতা বেশি; ঠিকানা বা রাইডারের সমস্যার কারণেও হতে পারে।"

  cod_remit_ontime_rate:
    group: C
    higher_is: better
    shown_when:
      positive: {above: 0.5}
    otherwise:
      positive:
        en: "More cash-on-delivery money is passed back on time than at similar shops."
        bn: "সমান ধরনের দোকানের তুলনায় ক্যাশ-অন-ডেলিভারির টাকা বেশি সময়মতো ফেরত আসে।"
    detail: {label: "Cash-on-delivery passed back on time", format: share}
    definition: Share of cash-on-delivery money passed back on time
    higher_means: reliable
    positive:
      en: "Cash-on-delivery money is passed back on time."
      bn: "ক্যাশ-অন-ডেলিভারির টাকা সময়মতো ফেরত আসে।"
    negative:
      en: "Cash-on-delivery money is often late."
      bn: "ক্যাশ-অন-ডেলিভারির টাকা প্রায়ই দেরিতে আসে।"

  dispatch_to_delivery_hours:
    group: C
    higher_is: worse
    detail: {label: "Delivery time", format: hours}
    definition: Median hours from dispatch to delivery
    higher_means: slower
    positive:
      en: "Parcels reach customers quickly."
      bn: "পার্সেল দ্রুত ক্রেতার কাছে পৌঁছায়।"
    negative:
      en: "Parcels take long to reach customers."
      bn: "পার্সেল পৌঁছাতে বেশি সময় লাগে।"

  delivery_data_thin:
    group: C
    model_input: false           # context only: shown on the profile, never given to the model
    definition: Fewer than 20 parcels in 90 days (flag)
    higher_means: less certain
    positive: null
    negative:
      en: "Delivery history is thin, so the picture is less certain."
      bn: "ডেলিভারির ইতিহাস কম, তাই চিত্রটি কম নিশ্চিত।"

  q_spend: &questionnaire_subscore
    group: D
    directional: true
    definition: Subscore (1-5) from the 10 questionnaire items
    higher_means: healthier habits
    positive:
      en: "Self-reported habits look healthy (directional)."
      bn: "নিজের দেওয়া তথ্য অনুযায়ী অভ্যাস ভালো (ইঙ্গিতমাত্র)।"
    negative:
      en: "Self-reported habits suggest some strain (directional)."
      bn: "নিজের দেওয়া তথ্য অনুযায়ী কিছু চাপ আছে (ইঙ্গিতমাত্র)।"
  q_save: *questionnaire_subscore
  q_borrow: *questionnaire_subscore
  q_plan: *questionnaire_subscore

  q_stress: &questionnaire_context
    group: D
    directional: true
    definition: Context item from the questionnaire
    higher_means: null
    positive:
      en: "Self-reported habits look healthy (directional)."
      bn: "নিজের দেওয়া তথ্য অনুযায়ী অভ্যাস ভালো (ইঙ্গিতমাত্র)।"
    negative:
      en: "Self-reported habits suggest some strain (directional)."
      bn: "নিজের দেওয়া তথ্য অনুযায়ী কিছু চাপ আছে (ইঙ্গিতমাত্র)।"
  q_confidence: *questionnaire_context

# Used for the coverage number only, never for score reasons.
coverage_only:
  - history_months
  - n_purchases_total
  - n_deliveries_total
  - n_payments_total
  - share_of_groups_present

# Features of the public data modes. Each mode has its own inputs, built only from fields
# that source really has (src/features/source_features.py). Same rules as above: every
# input says which way it points, sentences are observations, and a plain sentence is
# shown only when it is true for the client (`shown_when`), else the comparing one.
# "Client" is used instead of "shop": these sources are not merchants.
source_features:
  taiwan_cc:
    ontime_share_6m:
      group: B
      higher_is: better
      shown_when:
        positive: {above: 0.5}
        negative: {below: 0.5}
      otherwise:
        positive:
          en: "More monthly bills were paid on time than for similar clients."
          bn: "সমান ধরনের গ্রাহকের তুলনায় বেশি মাসের বিল সময়মতো পরিশোধ হয়েছে।"
        negative:
          en: "Fewer monthly bills were paid on time than for similar clients."
          bn: "সমান ধরনের গ্রাহকের তুলনায় কম মাসের বিল সময়মতো পরিশোধ হয়েছে।"
      detail: {label: "Months paid on time", format: share}
      definition: Of the last six months in which the card was used, the share with no late payment
      positive:
        en: "Most monthly bills in the last six months were paid on time."
        bn: "গত ছয় মাসের বেশিরভাগ বিল সময়মতো পরিশোধ হয়েছে।"
      negative:
        en: "Few monthly bills in the last six months were paid on time."
        bn: "গত ছয় মাসে কম বিল সময়মতো পরিশোধ হয়েছে।"

    worst_delay_6m:
      group: B
      higher_is: worse
      shown_when:
        positive: {at_most: 0}
        negative: {at_least: 2}
      otherwise:
        positive:
          en: "The longest payment delay was shorter than for similar clients."
          bn: "সমান ধরনের গ্রাহকের তুলনায় সবচেয়ে লম্বা দেরি কম ছিল।"
        negative:
          en: "The longest payment delay was longer than for similar clients."
          bn: "সমান ধরনের গ্রাহকের তুলনায় সবচেয়ে লম্বা দেরি বেশি ছিল।"
      detail: {label: "Longest delay", format: months}
      definition: The longest payment delay, in months, in the last six months
      positive:
        en: "No payment was late in the last six months."
        bn: "গত ছয় মাসে কোনো পেমেন্ট দেরিতে হয়নি।"
      negative:
        en: "A payment was late by two months or more in the last six months."
        bn: "গত ছয় মাসে কোনো পেমেন্ট দুই মাস বা তার বেশি দেরিতে হয়েছে।"

    latest_delay_months:
      group: B
      higher_is: worse
      shown_when:
        positive: {at_most: 0}
        negative: {at_least: 1}
      otherwise:
        positive:
          en: "The most recent delay was shorter than for similar clients."
          bn: "সমান ধরনের গ্রাহকের তুলনায় সবচেয়ে সাম্প্রতিক দেরি কম ছিল।"
        negative:
          en: "The most recent delay was longer than for similar clients."
          bn: "সমান ধরনের গ্রাহকের তুলনায় সবচেয়ে সাম্প্রতিক দেরি বেশি ছিল।"
      detail: {label: "Latest delay", format: months}
      definition: The payment delay, in months, in the most recent month
      positive:
        en: "The most recent bill was paid on time."
        bn: "সবচেয়ে সাম্প্রতিক বিল সময়মতো পরিশোধ হয়েছে।"
      negative:
        en: "The most recent bill was paid late."
        bn: "সবচেয়ে সাম্প্রতিক বিল দেরিতে পরিশোধ হয়েছে।"

    delay_trend_6m:
      group: B
      higher_is: worse
      shown_when:
        positive: {at_most: 0}
        negative: {above: 0}
      otherwise:
        positive:
          en: "Payment delays are growing more slowly than for similar clients."
          bn: "সমান ধরনের গ্রাহকের তুলনায় পেমেন্টের দেরি ধীরে বাড়ছে।"
        negative:
          en: "Payment delays are shrinking more slowly than for similar clients."
          bn: "সমান ধরনের গ্রাহকের তুলনায় পেমেন্টের দেরি ধীরে কমছে।"
      detail: {label: "Change in delay", format: months_change}
      definition: Average delay in the three newest months minus the three oldest, in months
      positive:
        en: "Payment delays have not been getting longer."
        bn: "পেমেন্টের দেরি বাড়ছে না।"
      negative:
        en: "Payment delays have been getting longer."
        bn: "পেমেন্টের দেরি বাড়ছে।"

    pay_to_bill_ratio:
      group: B
      higher_is: better
      detail: {label: "Paid share of bills", format: share}
      definition: Amount paid in five months divided by the bills of the month before each
      positive:
        en: "Payments covered a larger share of the bills than for similar clients."
        bn: "সমান ধরনের গ্রাহকের তুলনায় বিলের বেশি অংশ পরিশোধ হয়েছে।"
      negative:
        en: "Payments covered a smaller share of the bills than for similar clients."
        bn: "সমান ধরনের গ্রাহকের তুলনায় বিলের কম অংশ পরিশোধ হয়েছে।"

    limit_utilisation:
      group: B
      higher_is: worse
      detail: {label: "Credit limit in use", format: share}
      definition: Average bill over six months divided by the credit limit
      positive:
        en: "A smaller share of the credit limit is in use than for similar clients."
        bn: "সমান ধরনের গ্রাহকের তুলনায় ঋণসীমার কম অংশ ব্যবহার হচ্ছে।"
      negative:
        en: "A larger share of the credit limit is in use than for similar clients."
        bn: "সমান ধরনের গ্রাহকের তুলনায় ঋণসীমার বেশি অংশ ব্যবহার হচ্ছে।"

    balance_growth_6m:
      group: B
      higher_is: worse
      shown_when:
        positive: {at_most: 0}
        negative: {above: 0}
      otherwise:
        positive:
          en: "The balance has grown more slowly than for similar clients."
          bn: "সমান ধরনের গ্রাহকের তুলনায় বকেয়া ধীরে বেড়েছে।"
        negative:
          en: "The balance has fallen more slowly than for similar clients."
          bn: "সমান ধরনের গ্রাহকের তুলনায় বকেয়া ধীরে কমেছে।"
      detail: {label: "Balance change as a share of the limit", format: share_change}
      definition: Newest bill minus oldest bill, divided by the credit limit
      positive:
        en: "The outstanding balance has not grown over six months."
        bn: "ছয় মাসে বকেয়া বাড়েনি।"
      negative:
        en: "The outstanding balance has grown over six months."
        bn: "ছয় মাসে বকেয়া বেড়েছে।"

    no_payment_month_share:
      group: B
      higher_is: worse
      shown_when:
        positive: {at_most: 0}
        negative: {above: 0}
      otherwise:
        positive:
          en: "Fewer months went without a payment than for similar clients."
          bn: "সমান ধরনের গ্রাহকের তুলনায় পেমেন্ট ছাড়া মাস কম।"
      detail: {label: "Months with a bill but no payment", format: share}
      definition: Of the months that followed a bill, the share in which nothing was paid
      positive:
        en: "A payment was made in every month that followed a bill."
        bn: "বিলের পরের প্রতিটি মাসে পেমেন্ট হয়েছে।"
      negative:
        en: "In some months that followed a bill, no payment was made."
        bn: "বিলের পরের কিছু মাসে কোনো পেমেন্ট হয়নি।"
