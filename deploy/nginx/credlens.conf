# CredLens: Nginx site for the hosted demo.
#
# Install (docs/DEPLOY.md has every step):
#     sudo cp deploy/nginx/credlens.conf /etc/nginx/sites-available/credlens
#     sudo ln -s /etc/nginx/sites-available/credlens /etc/nginx/sites-enabled/credlens
#     sudo nginx -t && sudo systemctl reload nginx
# Then `sudo certbot --nginx -d YOUR-DOMAIN` adds HTTPS and the redirect to this file.
#
# What it does:
#   /          the built dashboard (web/dist). Any address the dashboard knows, such as
#              /merchants/M000031, is answered with index.html (the dashboard is a one-page app).
#   /api/...   passed to the API on this machine (port 8000) with the "/api" taken off.
#   the whole site asks for a user name and a password (Nginx "basic auth").
#
# The API itself is not reachable from outside: it listens on 127.0.0.1 only.

# One bucket per visitor address: at most 30 requests a second (a burst of 60 is allowed).
# This also slows down anyone guessing the site password.
limit_req_zone $binary_remote_addr zone=credlens:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;   # certbot needs a real name: replace _ with your domain (see DEPLOY.md)

    server_tokens off;
    root /opt/credlens/web/dist;
    index index.html;

    limit_req zone=credlens burst=60 nodelay;
    limit_req_status 429;   # not 503: a 503 would show the "starting" page below

    # --- the password for the whole site ---------------------------------------------------
    # Made with: sudo htpasswd -c /etc/nginx/credlens.htpasswd demo
    auth_basic "CredLens demo (decision support only)";
    auth_basic_user_file /etc/nginx/credlens.htpasswd;

    # --- headers on every answer -----------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # The page loads its fonts from Google Fonts for now. When they are served from this site,
    # remove the two fonts.* addresses.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- the API ---------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The site password is Nginx's business. The API must never see it.
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        # The data import accepts files up to 10 MB.
        client_max_body_size 11m;
        # Answers must not be kept by a browser or a proxy: they hold merchant data.
        add_header Cache-Control "no-store" always;
        # Repeated, because add_header in a location replaces the ones above it.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # --- the dashboard ---------------------------------------------------------------------
    # Files with a hash in their name never change: keep them for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html names the current files, so it must always be asked for again.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Any other address is a page of the dashboard: give index.html.
    location / {
        try_files $uri /index.html;
    }

    # Never serve a hidden file (.env, .git ...), whatever is on disk.
    location ~ /\. {
        deny all;
        return 404;
    }

    # While the API is starting (30 to 60 seconds) Nginx cannot reach it: say so kindly.
    error_page 502 503 504 /starting.html;
    location = /starting.html {
        root /opt/credlens/deploy/nginx;
        internal;
        add_header Cache-Control "no-store" always;
    }
}
