# All tunable numbers live here. Code must read them from this file.
seed: 42

data:
  mode: synthetic_bd             # synthetic_bd | kiva_asia | taiwan_cc | india_ltfs | homecredit
  raw_dir: data/raw              # gitignored; humans download public files here
  kiva:
    regions: [Asia]
    sectors: [Retail, Food, Services]
  taiwan_cc:
    sample_size: null            # null = all rows (about 30,000)
  homecredit:
    sample_size: 50000           # applicants sampled with the seed; null = all rows
  india_ltfs:
    sample_size: null            # null = all rows (about 233,000)
  n_merchants: 20000
  months: 18
  thin_file_share: 0.35          # share of new merchants with very few early purchases
  consent_rate: 0.95
  questionnaire_rate: 0.40
  no_delivery_data_share: 0.25   # merchants with no REDX-style records
  delivery_signal_strength: 0.5  # run ablation at 0, 0.5 and 1
  logistics_noise_share: 0.4     # share of returns/failures caused by address or rider issues
  questionnaire_in_model: false  # questionnaire shown beside the score, not inside it

generator:                       # synthetic_bd only; see docs/GENERATOR_SPEC.md
  start_date: "2025-01-01"       # first day of the 18-month window
  out_dir: data/raw/synthetic_bd # gitignored; one sub-folder per delivery signal strength
  observation_tail_days: 61     # activity continues this long after the 18 months, so every loan issued in the
                                 # 18 months has an outcome; loans issued in the tail are the pending cases.
                                 # Must exceed loan term (30) + allowed days late (30): a loan can only be
                                 # called bad once it is MORE than 30 days past its due date
  repayment_share_target: 0.90   # share of loans repaid within the 30-day rule. A team assumption, set between
                                 # published Bangladesh recovery rates (98% MRA FY2023; 99.5% City Bank-bKash nano
                                 # loans) and early-default rates in other Asian datasets (8-22%). No public figure
                                 # exists for 30-day lateness on merchant credit in Bangladesh.
  town_tier_shares: {metro: 0.25, city: 0.45, small_town: 0.30}
  shop_type_shares: {grocery: 0.35, pharmacy: 0.15, apparel: 0.20, electronics: 0.15, other: 0.15}
  trade_license_rate: {metro: 0.60, city: 0.40, small_town: 0.25}
  districts:
    metro: [Dhaka, Chattogram, Gazipur, Narayanganj]
    city: [Sylhet, Khulna, Rajshahi, Cumilla, Mymensingh, Barishal, Rangpur]
    small_town: [Bogura, Jashore, Dinajpur, Tangail, Pabna, Noakhali, Feni, Kushtia]
  categories:
    grocery: [rice_grain, cooking_oil, snacks, beverages, spices, household]
    pharmacy: [medicine, personal_care, baby_care, health_devices]
    apparel: [clothing, footwear, accessories, fabrics]
    electronics: [mobile_accessories, small_appliances, lighting, batteries]
    other: [stationery, toys, hardware, cosmetics, household]
  purchases:
    base_weekly_rate: 1.9        # purchases per week for an average merchant
    tier_effect: {metro: 0.15, city: 0.0, small_town: -0.15}   # added to log(rate)
    reliability_effect: 0.20     # added to log(rate) per unit of hidden reliability
    trend_per_month_per_reliability: 0.015   # growing vs shrinking shops (the spec's 0.1 compounds too fast over 18 months)
    trend_per_month_sd: 0.015
    weekly_noise_sd: 0.35
    seasonality_file: config/calibration/bb_mfs_merchant_payment.csv
    seasonality_strength: 1.0    # 0 = no seasonality, 1 = the detrended monthly shape in the file
    thin_file_rate_multiplier: 0.04   # thin-file merchants start at this share of their normal rate
    thin_file_ramp_days: 180     # and reach the normal rate after this many days
    thin_file_max_purchases_30d: 2    # how the tests recognise a thin file
    amount_median_bdt: {grocery: 9000, pharmacy: 14000, apparel: 12000, electronics: 18000, other: 8000}
    amount_sigma: 0.5
    amount_reliability_effect: 0.1
    n_suppliers: 400             # shared supplier pool
    main_suppliers_per_merchant: 2
    supplier_repeat_intercept: 0.4    # P(buy from a main supplier) = sigmoid(intercept + effect x reliability)
    supplier_repeat_effect: 0.35
  deliveries:
    base_weekly_parcels: 1.5
    volume_signal_effect: 0.3    # x signal strength x reliability, added to log(volume)
    volume_merchant_sd: 0.5
    return_intercept: -2.2       # P(merchant-attributable return) before the logistics share is taken out
    return_signal_effect: 0.9    # x signal strength x reliability (subtracted)
    failed_intercept: -3.2
    failed_signal_effect: 0.5
    merchant_noise_sd: 0.5
    cancelled_rate: 0.02
    cod_share: 0.7
    cod_remit_intercept: 1.2
    cod_remit_signal_effect: 0.8
    hours_log_mean: 3.2          # dispatch-to-delivery hours ~ LogNormal(mean - effect x strength x reliability, sigma)
    hours_signal_effect: 0.15
    hours_log_sigma: 0.4
  loans:
    min_days_after_onboarding: 45
    first_loan_delay_mean_days: 60
    gap_between_loans_mean_days: 75
    max_loans: 3
    term_days: 30
    limit_median_bdt: {metro: 60000, city: 40000, small_town: 25000}
    limit_sigma: 0.35
    limit_growth_per_loan: 0.25
    outcome_reliability_effect: 1.5
    outcome_noise_sd: 0.3        # larger = harder to predict; tuned so test AUC lands around 0.72-0.82
    late_days_log_mean: 1.6      # good payers: days late ~ Gamma with mean exp(1.6 - 0.6 x reliability)
    late_days_reliability_effect: 0.6
    late_days_shape: 1.5
    bad_extra_days_mean: 30      # bad loans that are eventually paid: 31 + Gamma(mean) days late
    bad_never_paid_share: 0.4
    utilisation_intercept: 0.3   # mean used share of the limit = sigmoid(intercept - effect x reliability)
    utilisation_effect: 0.4
    utilisation_concentration: 8
  questionnaire:
    item_mean: 3.0
    reliability_effect: 0.4
    item_noise_sd: 1.0
    answered_within_days: 30
  consent:
    valid_years: 2
    revoked_share_of_non_consenting: 0.5   # the rest have no consent record at all
  inject_group_bias: 0.0         # test switch only: subtracts this from the outcome score of small_town merchants,
                                 # to check that the fairness audit catches a planted gap

features:                        # how features are computed; see docs/FEATURE_DICTIONARY.md
  window_days: 90                # "recent" means this many days before the loan's cutoff date
  weekly_window_weeks: 12        # weekly statistics use this many whole weeks before the cutoff
  ontime_payment_days: 3         # a payment within this many days of the due date counts as on time
  late_payment_days: 7           # a payment more than this many days late counts as late
  delivery_settle_days: 3        # a parcel's outcome is treated as known this many days after dispatch
  thin_delivery_parcels: 20      # fewer parcels than this in the window: delivery history is thin
  coverage_history_days: 180     # 'history of at least 6 months' in the coverage checklist
  coverage_purchase_months: 6    # look at this many 30-day blocks before the cutoff ...
  coverage_purchase_month_share: 0.5   # ... purchases are 'present' if more than this share of them has a purchase
  recent_activity_days: 30       # a purchase or parcel within this many days counts as recent activity

database:
  url_env: DATABASE_URL          # Supabase Postgres connection string lives in this environment variable (.env, never committed)
  default_url: sqlite:///data/app.db   # used when the variable is not set: local development, tests, CI

labels:
  good_if_days_late_at_most: 30
  min_loan_age_days: 60          # younger loans are excluded (outcome unknown)
  paid_in_full_tolerance: 0.01   # a payment counts as made only if at least 99% of the amount due was paid

split:                           # by loan issue date
  train_months: 12
  validation_months: 3
  test_months: 3

split_by_mode:                   # a data source whose history is shorter than 18 months sets its own periods
  india_ltfs: {train_months: 1, validation_months: 1, test_months: 1}   # loans from Aug to Oct 2018 only

model:
  candidates: [logistic_regression, lightgbm]
  calibration: auto              # none | platt | isotonic | auto (compare on validation, keep the simplest that is good enough)
  calibration_folds: 5           # validation loans are cut into this many folds to compare the choices honestly
  calibration_min_brier_gain: 0.0002   # a more flexible calibrator must lower the Brier score by at least this
  prefer_simple_if_auc_gain_below: 0.01   # LightGBM is used only if the WHOLE range of its AUC gain reaches this
  bootstrap_resamples: 500
  logistic_regression:
    C: 1.0                       # regularisation strength (smaller = stronger)
    max_iter: 1000
    clip_quantiles: [0.01, 0.99] # extreme feature values are pulled in to these training quantiles
  lightgbm:
    clip_quantiles: [0.01, 0.99]
    tuning_months: 3             # the last months of the TRAINING period, held back to tune on (time split)
    tuning_share: 0.25           # the share of training loans held back to tune on (random split)
    max_trees: 2000              # upper limit; early stopping decides the real number
    early_stopping_rounds: 100   # stop when the tuning part has not improved for this many trees
    row_share_per_tree: 0.8      # each tree sees this share of the loans
    input_share_per_tree: 0.8    # and this share of the inputs
    l2_penalty: 5.0              # larger = more cautious trees
    grid:                        # every setting is tried; the lowest log loss on the tuning part wins
      - {num_leaves: 4, learning_rate: 0.05, min_child_samples: 100}
      - {num_leaves: 8, learning_rate: 0.05, min_child_samples: 100}
      - {num_leaves: 8, learning_rate: 0.03, min_child_samples: 200}
      - {num_leaves: 16, learning_rate: 0.03, min_child_samples: 200}
      - {num_leaves: 4, learning_rate: 0.03, min_child_samples: 300}

evaluation:
  calibration_bins: 10           # predictions are grouped into this many bins
  calibration_binning: quantile  # quantile = the same number of loans in each bin; width = equal-width bins.
                                 # With about 90% repaid, equal-width bins leave most bins empty
  top_k: 20                      # looks at the k highest-scored and the k lowest-scored loans
  lowest_share: 0.20             # share of the not-repaid loans found in the lowest-scored 20%
  bootstrap_level: 0.95          # width of the reported ranges

score:
  scale: 100
  # The three lines below were set from the validation scores of the synthetic data
  # (PROJECT_BRIEF section 18, item 26). They are settings, not facts: set them again
  # for any real data source.
  band_strong_min_score: 90      # "Strong" = the model expects at least 9 in 10 such loans to be repaid in time
  band_min_coverage: 0.45        # below this: "Needs more info", whatever the score
  low_score_warning_below: 70    # a score under this gets an explicit low-score warning
  by_mode: {}                    # optional own lines per data mode, e.g. taiwan_cc: {band_strong_min_score: 85}
  top_reasons_each_side: 3
  min_reason_points: 0.1         # a contribution smaller than this many score points is not shown as a reason
  max_inputs_for_exact_reasons: 14   # reasons are computed exactly; 14 inputs = 16,384 combinations per merchant
  reasons_report_sample: 300     # validation loans whose reasons are checked in the training report

coverage_weights_by_mode:        # public modes: coverage = how much of what the source can provide is present
  kiva_asia:                     # provisional until the real columns are inspected; must sum to 1.0
    loan_terms_present: 0.25
    sector_activity_present: 0.20
    partner_track_record: 0.30   # enough earlier closed loans for the field partner, as of the posting date
    borrower_info_present: 0.15
    description_present: 0.10
  taiwan_cc:                     # provisional until the real columns are inspected; must sum to 1.0
    credit_limit_present: 0.15
    repayment_status_history: 0.35
    bill_history: 0.25
    payment_history: 0.25
  india_ltfs:                    # provisional until Phase 7; must sum to 1.0
    loan_terms_present: 0.20
    bureau_record_present: 0.40    # about half the borrowers have no bureau history: real thin files
    credit_history_long_enough: 0.25
    employment_type_present: 0.15
  homecredit:                    # provisional until the real columns are inspected; must sum to 1.0
    application_data_present: 0.20
    instalment_history_present: 0.35
    enough_past_instalments: 0.25
    pos_cash_history_present: 0.20

coverage_weights:                # synthetic_bd; must sum to 1.0
  history_6_months: 0.25
  purchases_present: 0.20
  payments_present: 0.20
  deliveries_present: 0.15
  questionnaire_done: 0.10        # coverage only; questionnaire is not in the score
  recent_activity_30d: 0.10

fairness:
  group_columns: [town_tier, shop_type, has_trade_license]
  flag_gap_points: 0.05          # candidate gap; flagged only if bootstrap ranges do not overlap or it persists across seeds
  audit_only_columns:
    kiva_asia: [borrower_genders, country]
    taiwan_cc: [SEX, EDUCATION, MARRIAGE, age_band]
    india_ltfs: [age_band, State_ID, Employment.Type]   # provisional until Phase 7
    homecredit: [CODE_GENDER, age_band, REGION_RATING_CLIENT]

sanity:
  useful_auc_benchmark: 0.70     # CGAP: transactional MSE models around 0.70+ are useful
  suspicious_auc: 0.95           # synthetic AUC above this => look for leakage
  zero_signal_max_auc_gain: 0.01 # at signal strength 0, delivery features must not add more than this
  min_not_repaid_for_stable_metrics: 100   # fewer not-repaid loans than this: warn that the numbers are shaky
